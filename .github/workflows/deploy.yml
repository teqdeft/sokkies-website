name: Deploy Sokkies Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to dev.studioubique.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        timeout-minutes: 60
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                # change to "ftp" if FTPS stalls on your host
          port: 21
          local-dir: ./                 # deploy the entire repo
          server-dir: /public_html/sokkies-website/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.claude/**
            **/.vscode/**
            **/wp-config.php
            **/.env
            **/sokkies-local/wp-admin/**
            **/sokkies-local/wp-includes/**
            **/sokkies-local/wp-content/uploads/**
            **/sokkies-local/wp-content/upgrade/**
            **/sokkies-local/wp-content/cache/**
            **/*.log